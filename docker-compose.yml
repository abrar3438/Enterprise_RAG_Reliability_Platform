version: "3.9"

services:
  db:
    # pgvector/pgvector ships Postgres with the pgvector extension
    # pre-installed — saves us from manually compiling the extension.
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      # Named volume so data survives container restarts.
      - rag_pgdata:/var/lib/postgresql/data

volumes:
  rag_pgdata: